<!--
  ============================================
  [섹션 01] 히어로
  ============================================
-->

<style>
/* ── 공통 CSS (아임웹 위젯 간 CSS 비공유 대응) ── */
:root{--bg:#050505;--card:#0c0c0c;--border:#181818;--text:#fff;--sub:#888;--muted:#444;--accent:#2dd4a8;--accent2:#6ee7c7;--max:1200px;--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}.reveal.visible{opacity:1;transform:translateY(0)}
.sec{padding:100px 40px;max-width:var(--max);margin:0 auto}
.sec-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;font-weight:600}
.sec-heading{font-size:clamp(26px,3.5vw,40px);font-weight:700;line-height:1.3;letter-spacing:-0.5px;margin-bottom:16px}
.sec-desc{font-size:17px;line-height:1.75;color:var(--sub);max-width:560px}
.divider{width:100%;max-width:var(--max);height:1px;background:var(--border);margin:0 auto;transform:scaleX(0);transition:transform 0.8s cubic-bezier(0.4,0,0.2,1)}.divider.visible{transform:scaleX(1)}
@media(max-width:1024px){.sec{padding:80px 24px}}
@media(max-width:640px){.sec{padding:60px 20px}}

/* ── 히어로 고유 스타일 ── */
.hero{position:relative;height:100vh;min-height:550px;max-height:850px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('https://raw.githubusercontent.com/fup-commits/fup-services-assets/main/home/hero-lab.jpg') center/cover no-repeat}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,0.45) 0%,rgba(5,5,5,0.3) 40%,rgba(5,5,5,0.85) 100%)}
.hero-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6vw 8vh;max-width:1400px;margin:0 auto}
.hero-tag{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:600;opacity:0;animation:heroFadeInUp 0.6s ease forwards;animation-delay:0.3s}
.hero h1{font-size:clamp(32px,5.5vw,62px);font-weight:800;line-height:1.08;letter-spacing:-2px;margin-bottom:20px;max-width:700px}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln span{display:inline-block;opacity:0;transform:translateY(110%);animation:heroLineReveal 1s cubic-bezier(0.16,1,0.3,1) forwards}
.hero h1 .ln:nth-child(1) span{animation-delay:0.5s}
.hero h1 .ln:nth-child(2) span{animation-delay:0.65s}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:16px;line-height:1.75;color:rgba(255,255,255,0.7);max-width:460px;margin-bottom:32px;opacity:0;animation:heroFadeInUp 0.7s ease forwards;animation-delay:1s}
.hero-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border:1px solid rgba(255,255,255,0.2);border-radius:40px;font-size:13px;color:#ddd;backdrop-filter:blur(12px);background:rgba(255,255,255,0.04);transition:all 0.4s;opacity:0;animation:heroFadeInUp 0.6s ease forwards;animation-delay:1.3s;width:fit-content}
.hero-cta:hover{border-color:var(--accent);color:var(--accent);background:rgba(45,212,168,0.08);transform:translateY(-2px)}
.hero-cta svg{width:14px;height:14px;transition:transform 0.3s}
.hero-cta:hover svg{transform:translateX(4px)}
.hero-scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:heroFadeIn 0.5s ease forwards;animation-delay:1.5s;z-index:2}
.hero-scroll span{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.scroll-line{width:1px;height:32px;background:linear-gradient(180deg,var(--muted),transparent);animation:sd 1.5s ease-in-out infinite}
@keyframes sd{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes heroFadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroFadeIn{from{opacity:0}to{opacity:1}}
@keyframes heroLineReveal{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.hero-inner{padding:0 24px 6vh}}
</style>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-inner">
    <p class="hero-tag">FUP Global Partners</p>
    <h1>
      <span class="ln"><span>From Korea</span></span>
      <span class="ln"><span>to the <em>World</em></span></span>
    </h1>
    <p class="hero-sub">화장품 제조부터 유통, 콘텐츠 제작, 수출까지.<br/>뷰티 산업의 전 밸류체인을 운영하는 글로벌 기업.</p>
    <a class="hero-cta" href="#biz">
      사업 알아보기
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  <div class="hero-scroll"><span>Scroll</span><div class="scroll-line"></div></div>
</section>
